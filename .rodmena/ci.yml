      - name: Mutation red-proof of this shard's test files, then the allowlist check
        run: STABILIZE_OLD_RUNNERS="0.33.1=$PWD/.old331/bin/stabilize;0.32.1=$PWD/.old321/bin/stabilize" STABILIZE_REQUIRE_OLD_RUNNERS=1 REDPROOF_SHARD=4/4 REDPROOF_PG="${DATABASE_URL%/*}" REDPROOF_PG_CONTAINER= REDPROOF_PYTHON="$(command -v python3.14)" .venv/bin/python audit/redproof/run.py all --out "$PWD/.redproof" --workers 2 --sha HEAD --budget-hours 0.6

  manualproofs:
    name: "Manual red-proofs: each diff makes its test fail and the clean tree pass"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    timeout_minutes: 60
    steps:
      - name: Install
        run: uv venv .venv && uv pip install -p .venv/bin/python -e '.[dev,observability,cli]'
      - name: Published 0.33.1 and 0.32.1 for the takeover tests
        run: uv venv .old331 && uv pip install -p .old331/bin/python 'stabilize[postgres,cli]==0.33.1' && uv venv .old321 && uv pip install -p .old321/bin/python 'stabilize[postgres,cli]==0.32.1'
      - name: Manual proofs
        run: STABILIZE_OLD_RUNNERS="0.33.1=$PWD/.old331/bin/stabilize;0.32.1=$PWD/.old321/bin/stabilize" STABILIZE_REQUIRE_OLD_RUNNERS=1 STABILIZE_TEST_DSN="$DATABASE_URL" .venv/bin/python audit/redproof/manual_proofs.py
