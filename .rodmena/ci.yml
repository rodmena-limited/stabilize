version: 1

jobs:
  lint:
    name: "Lint and types"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    resources: { memory_mb: 1536 }
    timeout_minutes: 20
    steps:
      - name: Install
        run: uv venv .venv && uv pip install -p .venv/bin/python -e '.[dev,observability,cli]'
      - name: Ruff and mypy
        run: r=0; .venv/bin/ruff check src/ tests/ golden_standard_tests/ || r=1; .venv/bin/mypy src/ || r=1; exit $r

  tests:
    name: "Tests (sqlite + postgres)"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    timeout_minutes: 15
    steps:
      - name: Install
        run: uv venv .venv && uv pip install -p .venv/bin/python -e '.[dev,observability,cli]'
      - name: Unit and golden tests
        run: STABILIZE_TEST_DSN="$DATABASE_URL" .venv/bin/python -m pytest tests golden_standard_tests -q -n 3 -p no:cacheprovider --timeout 600 -rfE

  probes:
    name: "Audit probes"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    timeout_minutes: 40
    steps:
      - name: Install
        run: uv venv .venv && uv pip install -p .venv/bin/python -e '.[dev,observability,cli]'
      - name: Engine tables in a non-default schema for probe_schema_and_exists
        run: .venv/bin/stabilize mg-up --db-url "$DATABASE_URL?schema=orchestration"
      - name: Probe harness
        run: STABILIZE_PROBE_SCHEMA=orchestration PROBE_SET=sqlite AUDIT_ALLOW_DESTRUCTIVE=1 STABILIZE_PROBE_DSN="$DATABASE_URL" PYTHON=.venv/bin/python bash audit/evaluations/run_all.sh

  py311:
    name: "Tests on Python 3.11 (declared floor)"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.12
    services: [postgres]
    timeout_minutes: 15
    steps:
      - name: Install on a managed CPython 3.11
        run: uv venv -p 3.11 .venv311 && .venv311/bin/python -c "import sys; print(sys.version); sys.exit(0 if sys.version_info[:2] == (3, 11) else 1)" && uv pip install -p .venv311/bin/python -e '.[dev,observability,cli]'
      - name: Unit and golden tests
        run: PATH="$PWD/.venv311/bin:$PATH" STABILIZE_TEST_DSN="$DATABASE_URL" .venv311/bin/python -m pytest tests golden_standard_tests -q -n 3 -p no:cacheprovider --timeout 600 -rfE

  baseline:
    name: "Published 0.32.1 from PyPI: existing suite and probes"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    timeout_minutes: 50
    steps:
      - name: Install stabilize 0.32.1 from PyPI, not the checkout
        run: uv venv .old && uv pip install -p .old/bin/python --no-cache --refresh 'stabilize[postgres,cli,observability]==0.32.1' pytest pytest-xdist pytest-timeout pytest-asyncio testcontainers psutil pyyaml
      - name: Installed package is the published one
        run: .old/bin/python -c "import stabilize, sys; print(stabilize.__version__, stabilize.__file__); sys.exit(0 if stabilize.__version__ == '0.32.1' and 'site-packages' in stabilize.__file__ else 1)"
      - name: Existing suite against 0.32.1 (new red tests listed in expect/0.32.1.tests are excluded)
        run: |
          set -eu
          IGN=$(cut -d'|' -f1 audit/evaluations/expect/0.32.1.tests audit/evaluations/expect/0.32.1.new-api | cut -d':' -f1 | sort -u | sed '/^$/d; s/^/--ignore=/' | tr '\n' ' ')
          echo "ignored: $IGN"
          PATH="$PWD/.old/bin:$PATH" STABILIZE_TEST_DSN="$DATABASE_URL" .old/bin/python -m pytest tests golden_standard_tests $IGN --deselect tests/test_engine_context_keys.py::test_every_engine_written_key_is_registered --deselect tests/test_migration_discovery.py::test_get_migrations_finds_them_from_a_source_checkout --deselect tests/test_resilience.py::TestExecuteWithResilience::test_exception_propagates --ignore=tests/test_audit_refuter_regressions.py -q -n 3 -p no:cacheprovider --timeout 600 -rfE
      - name: Existing probes against 0.32.1 (new red probes listed in expect/0.32.1.probes are excluded)
        run: |
          set -eu
          export PATH="$PWD/.old/bin:$PATH"
          .old/bin/stabilize mg-up --db-url "$DATABASE_URL?schema=orchestration"
          PROBE_EXCLUDE_FILE=audit/evaluations/expect/0.32.1.probes STABILIZE_PROBE_SCHEMA=orchestration PROBE_SET=sqlite AUDIT_ALLOW_DESTRUCTIVE=1 STABILIZE_PROBE_DSN="$DATABASE_URL" PYTHON=.old/bin/python bash audit/evaluations/run_all.sh

  falsify:
    name: "New probes and tests go red on published 0.32.1 for their stated reason"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    timeout_minutes: 50
    steps:
      - name: Install stabilize 0.32.1 from PyPI, not the checkout
        run: uv venv .old && uv pip install -p .old/bin/python --no-cache --refresh 'stabilize[postgres,cli,observability]==0.32.1' pytest pytest-xdist pytest-timeout pytest-asyncio testcontainers psutil pyyaml
      - name: Probes listed in expect/0.32.1.probes fail on 0.32.1 with their marker, controls green
        run: |
          set -u
          export PATH="$PWD/.old/bin:$PATH"
          OLD_VERSION=0.32.1 AUDIT_ALLOW_DESTRUCTIVE=1 STABILIZE_PROBE_DSN="$DATABASE_URL" STABILIZE_PROBE_SQLITE_QUEUE_TABLES=1 PYTHON=.old/bin/python bash audit/evaluations/falsify_previous.sh; p=$?
          OLD_VERSION=0.32.1 STABILIZE_TEST_DSN="$DATABASE_URL" PYTHON=.old/bin/python bash audit/evaluations/falsify_tests.sh; t=$?
          echo "probe falsification exit=$p test falsification exit=$t"
          [ "$p" -eq 0 ] && [ "$t" -eq 0 ]

  upgrade:
    name: "Work in flight under published 0.32.1 finishes under this checkout"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    timeout_minutes: 25
    steps:
      - name: Install published 0.32.1 and this checkout side by side
        run: uv venv .old && uv pip install -p .old/bin/python 'stabilize[postgres,cli]==0.32.1' && uv venv .venv && uv pip install -p .venv/bin/python -e '.[dev,observability,cli]'
      - name: Old release starts the work, this checkout finishes it
        run: |
          set -eu
          export STABILIZE_PROBE_DSN="$DATABASE_URL" UPGRADE_STATE_FILE="$PWD/upgrade-state.json"
          PATH="$PWD/.old/bin:$PATH" .old/bin/python audit/evaluations/upgrade_inflight.py --phase old
          PATH="$PWD/.venv/bin:$PATH" .venv/bin/python audit/evaluations/upgrade_inflight.py --phase new

  soak:
    name: "Sustained run: 5 min on PostgreSQL (release candidate only)"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    timeout_minutes: 15
    steps:
      - name: Install
        run: uv venv .venv && uv pip install -p .venv/bin/python -e '.[dev,observability,cli]'
      - name: Soak
        run: PATH="$PWD/.venv/bin:$PATH" STABILIZE_PROBE_DSN="$DATABASE_URL" SOAK_MINUTES=5 .venv/bin/python audit/evaluations/soak.py


  redproof:
    name: "Every test fails on at least one engine mutant (red-proof)"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    resources: { memory_mb: 3072 }
    timeout_minutes: 600
    steps:
      - name: Install
        run: uv venv .venv && uv pip install -p .venv/bin/python -e '.[dev,observability,cli]'
      - name: Mutation red-proof of the whole suite, then the allowlist check
        run: REDPROOF_PG="${DATABASE_URL%/*}" REDPROOF_PG_CONTAINER= REDPROOF_PYTHON="$(command -v python3.14)" .venv/bin/python audit/redproof/run.py all --out "$PWD/.redproof" --workers 2 --sha HEAD --budget-hours 4
      - name: Manual proofs (each diff must make its test fail and the clean tree pass)
        run: if [ -f audit/redproof/manual_proofs.py ]; then .venv/bin/python audit/redproof/manual_proofs.py; fi
