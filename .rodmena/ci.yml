version: 1

jobs:
  lint:
    name: "Lint and types"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    resources: { memory_mb: 1536 }
    timeout_minutes: 20
    steps:
      - name: Install
        run: uv venv .venv && uv pip install -p .venv/bin/python -e '.[dev,observability,cli]'
      - name: Ruff and mypy
        run: r=0; .venv/bin/ruff check src/ tests/ golden_standard_tests/ || r=1; .venv/bin/mypy src/ || r=1; exit $r

  tests:
    name: "Tests (sqlite + postgres)"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    timeout_minutes: 45
    steps:
      - name: Install
        run: uv venv .venv && uv pip install -p .venv/bin/python -e '.[dev,observability,cli]'
      - name: Unit and golden tests
        run: STABILIZE_TEST_DSN="$DATABASE_URL" .venv/bin/python -m pytest tests golden_standard_tests -q -n 3 -p no:cacheprovider --timeout 600 -rfE

  probes:
    name: "Audit probes"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    timeout_minutes: 40
    steps:
      - name: Install
        run: uv venv .venv && uv pip install -p .venv/bin/python -e '.[dev,observability,cli]'
      - name: Engine tables in a non-default schema for probe_schema_and_exists
        run: .venv/bin/stabilize mg-up --db-url "$DATABASE_URL?schema=orchestration"
      - name: Probe harness
        run: STABILIZE_PROBE_SCHEMA=orchestration PROBE_SET=sqlite AUDIT_ALLOW_DESTRUCTIVE=1 STABILIZE_PROBE_DSN="$DATABASE_URL" PYTHON=.venv/bin/python bash audit/evaluations/run_all.sh

  falsify:
    name: "New probes go red on 0.31.0"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    timeout_minutes: 30
    steps:
      - name: Install published 0.31.0
        run: uv venv .old-venv && uv pip install -p .old-venv/bin/python 'stabilize[postgres,cli]==0.31.0'
      - name: Each new probe must fail against 0.31.0
        run: AUDIT_ALLOW_DESTRUCTIVE=1 STABILIZE_PROBE_DSN="$DATABASE_URL" STABILIZE_PROBE_SQLITE_QUEUE_TABLES=1 PYTHON=.old-venv/bin/python bash audit/evaluations/falsify_previous.sh

  published:
    name: "Published 0.32.0 from PyPI: suite and probes"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    timeout_minutes: 50
    steps:
      - name: Install stabilize 0.32.0 from PyPI, not the checkout
        run: uv venv .pub && uv pip install -p .pub/bin/python --no-cache --refresh 'stabilize[postgres,cli,observability]==0.32.0' pytest pytest-xdist pytest-timeout pytest-asyncio testcontainers psutil pyyaml
      - name: Installed package is the published one
        run: .pub/bin/python -c "import stabilize, sys; print(stabilize.__version__, stabilize.__file__); sys.exit(0 if stabilize.__version__ == '0.32.0' and 'site-packages' in stabilize.__file__ else 1)"
      - name: Suite against the installed package
        run: PATH="$PWD/.pub/bin:$PATH" STABILIZE_TEST_DSN="$DATABASE_URL" .pub/bin/python -m pytest tests golden_standard_tests -q -n 3 -p no:cacheprovider --timeout 600 -rfE
      - name: Probes against the installed package
        run: .pub/bin/stabilize mg-up --db-url "$DATABASE_URL?schema=orchestration" && STABILIZE_PROBE_SCHEMA=orchestration PROBE_SET=sqlite AUDIT_ALLOW_DESTRUCTIVE=1 STABILIZE_PROBE_DSN="$DATABASE_URL" PYTHON=.pub/bin/python bash audit/evaluations/run_all.sh
