    steps:
      - name: Install
        run: uv venv .venv && uv pip install -p .venv/bin/python -e '.[dev,observability,cli]'
      - name: Published 0.33.1 and 0.32.1 for the takeover tests
        run: uv venv .old331 && uv pip install -p .old331/bin/python 'stabilize[postgres,cli]==0.33.1' && uv venv .old321 && uv pip install -p .old321/bin/python 'stabilize[postgres,cli]==0.32.1'
      - name: Mutation red-proof of this shard's test files, then the allowlist check
        run: STABILIZE_OLD_RUNNERS="0.33.1=$PWD/.old331/bin/stabilize;0.32.1=$PWD/.old321/bin/stabilize" STABILIZE_REQUIRE_OLD_RUNNERS=1 REDPROOF_SHARD=2/4 REDPROOF_PG="${DATABASE_URL%/*}" REDPROOF_PG_CONTAINER= REDPROOF_PYTHON="$(command -v python3.14)" .venv/bin/python audit/redproof/run.py all --out "$PWD/.redproof" --workers 2 --sha HEAD --budget-hours 0.6

  redproof-3:
    name: "Red-proof shard 3 of 4: every test fails on at least one engine mutant"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    resources: { memory_mb: 2048 }
    timeout_minutes: 170
    artifacts: [.redproof/proof.tsv, .redproof/unproven.tsv]
    steps:
      - name: Install
        run: uv venv .venv && uv pip install -p .venv/bin/python -e '.[dev,observability,cli]'
      - name: Published 0.33.1 and 0.32.1 for the takeover tests
        run: uv venv .old331 && uv pip install -p .old331/bin/python 'stabilize[postgres,cli]==0.33.1' && uv venv .old321 && uv pip install -p .old321/bin/python 'stabilize[postgres,cli]==0.32.1'
      - name: Mutation red-proof of this shard's test files, then the allowlist check
        run: STABILIZE_OLD_RUNNERS="0.33.1=$PWD/.old331/bin/stabilize;0.32.1=$PWD/.old321/bin/stabilize" STABILIZE_REQUIRE_OLD_RUNNERS=1 REDPROOF_SHARD=3/4 REDPROOF_PG="${DATABASE_URL%/*}" REDPROOF_PG_CONTAINER= REDPROOF_PYTHON="$(command -v python3.14)" .venv/bin/python audit/redproof/run.py all --out "$PWD/.redproof" --workers 2 --sha HEAD --budget-hours 0.6

  redproof-4:
    name: "Red-proof shard 4 of 4: every test fails on at least one engine mutant"
    image: containers.rodmena.co.uk/rodmena/ci-python:3.14
    services: [postgres]
    resources: { memory_mb: 2048 }
    timeout_minutes: 170
    artifacts: [.redproof/proof.tsv, .redproof/unproven.tsv]
