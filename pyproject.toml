[project]
name = "stabilize"
version = "0.34.4"
description = "Stabilize Workflow Orchestration - Agentic Parallel Workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Farshid Ashouri", email = "farsheed.ashouri@gmail.com"}
]
keywords = ["workflow", "dag", "orchestration", "pipeline", "task-runner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "python-ulid>=3.2",
    "pydantic>=2.0",
    # NO UPPER BOUNDS here on the house libraries, because stabilize is pulled
    # in transitively almost everywhere and a cap of ours would block their
    # fixes from reaching anyone.
    #
    # BUT THIS IS NOT WHERE THE ESTATE-WIDE CEILING LIVES, and an earlier
    # version of this comment claimed it was. bulkman depends on
    # resilient-circuit[postgres]<0.9, so the effective ceiling for every
    # consumer of stabilize is bulkman's, not ours. It is deliberate and held:
    # bulkman drives CircuitProtectorPolicy._status, a private attribute, so a
    # resilient-circuit minor could break it at import time with no major bump.
    # Argue with it there (bulkman SPECS/12), not here.
    #
    # Two further things arrive through that same line rather than through
    # ours: its [postgres] extra pulls psycopg and python-dotenv into EVERY bare
    # stabilize install, so our own `postgres` extra does not gate psycopg
    # (bulkman #15). psycopg-pool is ours, from our own psycopg[pool]. Our
    # guarded `import psycopg` branches therefore almost never execute in
    # practice.
    #
    # Floors are kept and are not caps: bulkman 2.0.1 added
    # BulkheadShutdownError, which resilience/executor.py's shutdown-race
    # classification requires, and every bulkman before 2.0.4 itself caps
    # resilient-circuit below 0.8, so a lower floor would let a resolver pick
    # one that forbids the version we want. resilient-circuit's floor is 0.8.5:
    # every earlier version logs some shape of malformed conninfo with its
    # password (0.8.4 closed the URL shapes, 0.8.5 the rest).
    #
    # The tradeoff, stated rather than hidden: a future breaking major will
    # install silently. The engine is built to survive that rather than to
    # prevent it — a breaker store it cannot construct is reported at ERROR
    # naming the consequence, and STABILIZE_CIRCUIT_STORAGE_STRICT=1 turns it
    # into a startup failure instead of process-local state.
    "bulkman>=2.0.4",
    "resilient-circuit>=0.8.5",
]

[project.optional-dependencies]
postgres = [
    "psycopg[pool]>=3.0",
    "psycopg-pool>=3.2.0",
    "migretti>=0.10.0",
]
c = [
    "psycopg[c,pool]>=3.0",
    "psycopg-pool>=3.2.0",
    "migretti>=0.10.0",
]
cli = [
    "pyyaml>=6.0",
]
observability = [
    "structlog>=24.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
process = [
    "psutil>=5.9",
]
all = [
    "psycopg[pool]>=3.0",
    "psycopg-pool>=3.2.0",
    "migretti>=0.10.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "psutil>=5.9",
]
dev = [
    "psycopg[pool]>=3.0",
    "psycopg-pool>=3.2.0",
    "migretti>=0.10.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "testcontainers>=4.0",
    "ruff>=0.1",
    "mypy>=1.8",
    "types-psutil>=7.0",
    "types-PyYAML>=6.0",
    "structlog>=24.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "psutil>=5.9",
]

[project.scripts]
stabilize = "stabilize.cli:main"

[project.urls]
Homepage = "https://github.com/rodmena-limited/stabilize"
Repository = "https://github.com/rodmena-limited/stabilize"
Issues = "https://github.com/rodmena-limited/stabilize/issues"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stabilize"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/migrations",
    "/examples",
]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "stabilize/migrations"
"examples" = "stabilize/examples"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "ANN401",
    "PLC0415",
    "TRY003",
    "EM101",
    "EM102",
    "FBT001",
    "FBT002",
    "FBT003",
    "ARG001",
    "ARG002",
    "ARG005",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "BLE001",
    "SLF001",
    "PLW0603",
    "S603",
    "S608",
    "B027",
    "TRY400",
    "TRY301",
    "TRY004",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/stabilize/queue/messages.py" = ["TC001", "TC002", "TC003"]
"src/stabilize/queue/messages/*" = ["TC001", "TC002", "TC003"]
"src/stabilize/cli/*" = ["T201"]
"src/stabilize/models/stage/stage.py" = ["A002"]
"src/stabilize/tasks/http/request.py" = ["S310"]
"src/stabilize/tasks/highway/task.py" = ["S310"]
"src/stabilize/llm/client.py" = ["S310"]
"src/stabilize/tasks/docker.py" = ["S607"]
"src/stabilize/tasks/ssh.py" = ["S607"]
"!src/**" = ["A", "AIR", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "COM", "CPY", "D", "DJ", "DOC", "DTZ", "EM", "ERA", "EXE", "FA", "FAST", "FBT", "FIX", "FLY", "FURB", "G", "I002", "ICN", "INP", "INT", "ISC", "LOG", "NPY", "PD", "PERF", "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "TC", "TD", "TID", "TRY", "YTT"]
"examples/*" = ["E402", "N999", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "truthy-bool", "possibly-undefined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*:",
    "ignore::DeprecationWarning:psycopg_pool.*:",
]
markers = [
    "stress: marks tests as stress tests (may take longer to run)",
    "race_condition: marks tests that test for race conditions",
    "both_backends: marks tests that explicitly test both SQLite and PostgreSQL backends",
]
