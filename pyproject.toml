[project]
name = "stabilize"
version = "0.21.1"
description = "Stabilize Workflow Orchestration - Agentic Parallel Workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Farshid Ashouri", email = "farsheed.ashouri@gmail.com"}
]
keywords = ["workflow", "dag", "orchestration", "pipeline", "task-runner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "python-ulid>=2.0",
    "pydantic>=2.0",
    # 2.0.1 adds BulkheadShutdownError; the shutdown-race classification in
    # stabilize.resilience.executor depends on that type existing.
    "bulkman>=2.0.1,<3",
    # bulkman 2.0.1 requires resilient-circuit >=0.4.6,<0.5; bulkman 2.0.2
    # requires >=0.5.0,<0.6. Keep our floor at or above bulkman 2.0.1's so a
    # resolver cannot pick one bulkman rejects, and keep the cap wide enough
    # to admit resilient-circuit 0.7.x (RC_DB_DSN / RC_DB_SSL* — the only way
    # to reach a TLS-mandatory breaker database). With bulkman 2.0.2 present
    # the resolver picks 0.5.x; without it, 0.7.x.
    "resilient-circuit>=0.4.6,<0.8",
]

[project.optional-dependencies]
postgres = [
    "psycopg[pool]>=3.0",
    "migretti>=0.3",
]
observability = [
    "structlog>=24.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
process = [
    "psutil>=5.9",
]
all = [
    "psycopg[pool]>=3.0",
    "migretti>=0.3",
    "structlog>=24.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "psutil>=5.9",
]
dev = [
    "psycopg[pool]>=3.0",
    "migretti>=0.3",
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "testcontainers>=4.0",
    "ruff>=0.1",
    "mypy>=1.8",
    "structlog>=24.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "psutil>=5.9",
]

[project.scripts]
stabilize = "stabilize.cli:main"

[project.urls]
Homepage = "https://github.com/rodmena-limited/stabilize"
Repository = "https://github.com/rodmena-limited/stabilize"
Issues = "https://github.com/rodmena-limited/stabilize/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stabilize"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/migrations",
    "/examples",
]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "stabilize/migrations"
"examples" = "stabilize/examples"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "N804",  # First argument of a class method should be named `cls` - we use `mcs` for metaclasses
]

[tool.ruff.lint.per-file-ignores]
# Examples use logging.basicConfig before imports intentionally to suppress noise
# Also have hyphenated filenames which are not valid module names (not meant to be imported)
"examples/*" = ["E402", "N999", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*:",
    "ignore::DeprecationWarning:psycopg_pool.*:",
]
markers = [
    "stress: marks tests as stress tests (may take longer to run)",
    "race_condition: marks tests that test for race conditions",
    "both_backends: marks tests that explicitly test both SQLite and PostgreSQL backends",
]
